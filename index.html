<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />

    <title>Min</title>

    <link rel="stylesheet" href="dist/bundle.css" />
    <link rel="stylesheet" href="ext/icons/iconfont.css" />
    <link rel="stylesheet" href="ext/icons/codicon.css" />
  </head>

  <body>
    <div class="window-drag-area"></div>

    <div class="windows-caption-buttons">
      <div class="element caption-minimise">
        <svg>
          <line x1="1" y1="5.5" x2="11" y2="5.5" />
        </svg>
      </div>
      <div class="element caption-maximize">
        <svg>
          <rect x="1.5" y="1.5" width="9" height="9" />
        </svg>
      </div>
      <div class="element caption-restore">
        <svg>
          <rect x="1.5" y="3.5" width="7" height="7" />
          <polyline points="3.5,3.5 3.5,1.5 10.5,1.5 10.5,8.5 8.5,8.5" />
        </svg>
      </div>
      <div class="element caption-close">
        <svg>
          <path d="M1,1 l 10,10 M1,11 l 10,-10" />
        </svg>
      </div>
    </div>

    <button id="linux-control-buttons" class="theme-text-color">
      <svg
        width="74"
        height="24"
        version="1.1"
        fill="none"
        stroke="none"
        stroke-linecap="square"
        stroke-miterlimit="10"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g id="minimize-button">
          <rect width="24" height="24" fill="transparent"></rect>
          <path
            class="button-background"
            d="m0.5826226 9.868774l0 0c0 -5.24453 4.251532 -9.496062 9.496063 -9.496062l0 0c2.5185127 0 4.933873 1.0004752 6.714731 2.7813323c1.7808571 1.7808576 2.781332 4.196218 2.781332 6.7147303l0 0c0 5.2445316 -4.2515326 9.496063 -9.496063 9.496063l0 0c-5.244531 0 -9.496063 -4.2515316 -9.496063 -9.496063z"
            fill-rule="evenodd"
          />
          <path
            stroke="currentColor"
            stroke-width="2.0"
            stroke-linejoin="round"
            stroke-linecap="butt"
            d="m6.7086616 12.519685l6.7401576 -0.031496048"
            fill-rule="evenodd"
          />
        </g>
        <g id="maximize-button">
          <rect width="24" height="24" x="24" fill="transparent"></rect>
          <path
            class="button-background"
            d="m27.85034 9.868774l0 0c0 -5.24453 4.2515316 -9.496062 9.496061 -9.496062l0 0c2.5185127 0 4.933876 1.0004752 6.714733 2.7813323c1.7808571 1.7808576 2.78133 4.196218 2.78133 6.7147303l0 0c0 5.2445316 -4.2515297 9.496063 -9.496063 9.496063l0 0c-5.2445297 0 -9.496061 -4.2515316 -9.496061 -9.496063z"
            fill-rule="evenodd"
          />
          <path
            stroke="currentColor"
            stroke-width="2.0"
            stroke-linejoin="round"
            stroke-linecap="butt"
            d="m34.16273 6.717848l6.3622017 0l0 6.2992125l-6.3622017 0z"
            fill-rule="evenodd"
          />
        </g>
        <g id="close-button">
          <rect width="24" height="24" x="48" fill="transparent"></rect>
          <path
            class="button-background"
            d="m55.118057 9.496072l0 0c0 -5.244531 4.2515297 -9.496063 9.496063 -9.496063l0 0c2.518509 0 4.9338684 1.0004753 6.7147293 2.7813325c1.7808533 1.7808573 2.781334 4.1962185 2.781334 6.714731l0 0c0 5.2445307 -4.2515335 9.496062 -9.496063 9.496062l0 0c-5.2445335 0 -9.496063 -4.2515316 -9.496063 -9.496062z"
            fill-rule="evenodd"
          />
          <path
            stroke="currentColor"
            stroke-width="2.0"
            stroke-linejoin="round"
            stroke-linecap="butt"
            d="m61.26077 6.1103663l6.740162 6.7716537"
            fill-rule="evenodd"
          />
          <path
            stroke="currentColor"
            stroke-width="2.0"
            stroke-linejoin="round"
            stroke-linecap="butt"
            d="m68.01668 6.1261144l-6.771656 6.7401576"
            fill-rule="evenodd"
          />
        </g>
      </svg>
    </button>

    <div
      id="navbar"
      class="theme-background-color theme-text-color windowDragHandle"
      tabindex="-1"
    >
    <div id="mac-window-drag-area"></div>
      <button
        id="sidebar-toggle-button"
        class="windowDragHandle navbar-action-button codicon codicon-layout-sidebar-left"
        data-label="sidebarToggle"
        tabindex="-1"
      ></button>
      <button
        id="workspace-indicator"
        class="windowDragHandle"
        data-label="viewTasks"
        tabindex="-1"
      >
        <span class="workspace-indicator-icon i carbon:user-multiple"></span>
        <span class="workspace-indicator-name"></span>
      </button>
      <button
        id="switch-task-button"
        class="windowDragHandle navbar-action-button"
        data-label="viewTasks"
        tabindex="-1"
      >
        <svg
          version="1.1"
          viewBox="0.0 0.0 26.0 26.0"
          fill="none"
          stroke="none"
          stroke-linecap="square"
          stroke-miterlimit="10"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g clip-path="url(#p.0)">
            <path
              fill="currentColor"
              d="m0 0l32 0l0 4l-32 0z"
              fill-rule="evenodd"
            />
            <path
              fill="currentColor"
              d="m0 11l32 0l0 4l-32 0z"
              fill-rule="evenodd"
            />
            <path
              fill="currentColor"
              d="m0 22l32 0l0 4l-32 0z"
              fill-rule="evenodd"
            />
          </g>
        </svg>
      </button>
      <div id="toolbar-navigation-buttons" hidden>
          <button
          id="back-button"
          class="navbar-action-button i carbon:chevron-left"
          data-label="goBack"
          tabindex="-1"
        ></button>
        <button
        id="forward-button"
        class="navbar-action-button i carbon:chevron-right"
        data-label="goForward"
        tabindex="-1"
      ></button>
      </div>
      <div id="tabs">
        <div id="tab-editor" hidden>
          <input id="tab-editor-input" spellcheck="false" />
        </div>
        <div id="tabs-inner" role="tablist" class="has-thin-scrollbar"></div>
      </div>
      <div class="navbar-right-actions">
        <button
          id="split-view-button"
          class="navbar-action-button i carbon:split-screen"
          data-label="splitViewAction"
          tabindex="-1"
        ></button>
        <button
          id="add-tab-button"
          class="navbar-action-button i carbon:add"
          data-label="newTabAction"
          tabindex="-1"
        ></button>
        <button
          id="menu-button"
          class="navbar-action-button i carbon:overflow-menu-vertical"
          data-label="openMenu"
          tabindex="-1"
        ></button>
      </div>
    </div>

    <div id="searchbar" class="theme-background-color theme-text-color">
      <div class="top-answer-area"></div>
    </div>

    <div id="overlay"></div>

    <div id="webviews">
      <div id="leftArrowContainer" class="arrow-indicator">
        <i id="leftArrow" class="i carbon:chevron-left"></i>
      </div>
      <div id="rightArrowContainer" class="arrow-indicator">
        <i id="rightArrow" class="i carbon:chevron-right"></i>
      </div>
      <div id="ntp-content">
          <img id="ntp-background" hidden>
          <div id="ntp-background-controls">
            <button id="ntp-image-remove"><i class="i carbon:trash-can"></i></button>
            <button id="ntp-image-picker"><i class="i carbon:camera"></i></button>
          </div>
      </div>
    </div>

    <!-- VSCode-style sidebar: activity bar + panel. Shifts the webviews. -->

    <div id="sidebar" hidden>
      <div id="activity-bar" role="tablist">
        <button
          id="sidebar-tab-ai"
          class="activity-bar-tab codicon codicon-sparkle"
          data-label="sidebarAi"
          data-sidebar-tab="ai"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-files"
          class="activity-bar-tab codicon codicon-files"
          data-label="sidebarFileTree"
          data-sidebar-tab="files"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-git"
          class="activity-bar-tab codicon codicon-source-control"
          data-label="sidebarGit"
          data-sidebar-tab="git"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-playbook"
          class="activity-bar-tab codicon codicon-checklist"
          data-label="sidebarPlaybook"
          data-sidebar-tab="playbook"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-design"
          class="activity-bar-tab codicon codicon-symbol-color"
          data-label="sidebarDesign"
          data-sidebar-tab="design"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-docs"
          class="activity-bar-tab codicon codicon-book"
          data-label="sidebarDocs"
          data-sidebar-tab="docs"
          tabindex="-1"
        ></button>
        <button
          id="sidebar-tab-notes"
          class="activity-bar-tab codicon codicon-note"
          data-label="sidebarNotes"
          data-sidebar-tab="notes"
          tabindex="-1"
        ></button>
        <div class="activity-bar-bottom">
          <button
            id="sidebar-settings-button"
            class="activity-bar-tab codicon codicon-settings-gear"
            data-label="viewSettings"
            data-sidebar-settings="true"
            tabindex="-1"
          ></button>
        </div>
      </div>
      <div id="sidebar-panels">
        <div class="sidebar-panel" id="sidebar-panel-ai" data-sidebar-panel="ai"></div>
        <div class="sidebar-panel" id="sidebar-panel-files" data-sidebar-panel="files"></div>
        <div class="sidebar-panel" id="sidebar-panel-git" data-sidebar-panel="git"></div>
        <div class="sidebar-panel" id="sidebar-panel-playbook" data-sidebar-panel="playbook"></div>
        <div class="sidebar-panel" id="sidebar-panel-design" data-sidebar-panel="design"></div>
        <div class="sidebar-panel" id="sidebar-panel-docs" data-sidebar-panel="docs"></div>
        <div class="sidebar-panel" id="sidebar-panel-notes" data-sidebar-panel="notes"></div>
        <div id="sidebar-prompt-backdrop" hidden></div>
        <div id="app-prompt-modal" class="sidebar-prompt-modal" hidden>
          <button class="modal-close-button i carbon:close" id="app-prompt-close"></button>
          <h3 class="modal-title" id="app-prompt-title"></h3>
          <p id="app-prompt-message" hidden></p>
          <div class="ws-modal-field" id="app-prompt-field">
            <label for="app-prompt-input" id="app-prompt-label"></label>
            <input type="text" id="app-prompt-input" spellcheck="false" />
          </div>
          <div class="ws-modal-actions">
            <div class="ws-modal-actions-right">
              <button id="app-prompt-cancel" type="button"></button>
              <button id="app-prompt-ok" type="button"></button>
            </div>
          </div>
        </div>
      </div>
      <div id="sidebar-resizer" title=""></div>
    </div>

    <!-- findinpage ui -->

    <div
      id="findinpage-bar"
      hidden
      class="theme-background-color theme-text-color"
    >
      <input id="findinpage-input" />
      <span id="findinpage-count" class="inline-text"></span>
      <div class="divider"></div>
      <button id="findinpage-previous-match">
        <i class="i carbon:chevron-up navbar-action-button"></i>
      </button>
      <button id="findinpage-next-match">
        <i class="i carbon:chevron-down navbar-action-button"></i>
      </button>
      <div class="divider"></div>
      <button id="findinpage-end">
        <i class="i carbon:close navbar-action-button"></i>
      </button>
    </div>

    <div id="task-overlay" class="" hidden tabindex="-1">
      <div
        class="simulated-navbar windowDragHandle"
        id="task-overlay-navbar"
      >
      <div class="task-search-input-container">
        <i class="i carbon:search"></i>
        <input type="search" id="task-search-input"/>
      </div>
    </div>
      <div id="task-area"></div>
      <button id="add-task">
        <i class="i carbon:new-tab"></i>
        <span></span>
      </button>
    </div>

    <div id="workspace-backdrop" hidden></div>

    <div id="workspace-drawer" hidden tabindex="-1">
      <div class="simulated-navbar windowDragHandle" id="workspace-drawer-navbar">
        <span class="ws-navbar-title" data-string="workspacesHeading"></span>
        <button id="add-workspace" data-label="newTask"><i class="i carbon:add"></i></button>
        <button id="manage-profiles-button" title=""><i class="i carbon:user-multiple"></i></button>
      </div>
      <div id="workspace-list"></div>
    </div>

    <div id="workspace-modal" class="modal" hidden>
      <button class="modal-close-button i carbon:close"></button>
      <h3 class="modal-title" id="workspace-modal-title"></h3>
      <div class="ws-modal-field">
        <label for="workspace-modal-name" data-string="workspaceNameLabel"></label>
        <input type="text" id="workspace-modal-name" spellcheck="false" />
      </div>
      <div class="ws-modal-field">
        <label for="workspace-modal-profile" data-string="taskProfileLabel"></label>
        <select id="workspace-modal-profile"></select>
      </div>
      <div class="ws-modal-field">
        <label for="workspace-modal-path" data-string="workspacePathLabel"></label>
        <input type="text" id="workspace-modal-path" spellcheck="false" />
        <button
          id="workspace-modal-browse"
          class="i carbon:folder-open"
          data-label="workspacePathBrowse"
        ></button>
        <button
          id="workspace-modal-clear-path"
          class="i carbon:close"
          data-label="workspacePathClear"
        ></button>
      </div>
      <div class="ws-modal-actions">
        <button id="workspace-modal-delete" class="ws-modal-delete" data-string="taskDelete"></button>
        <div class="ws-modal-actions-right">
          <button id="workspace-modal-cancel" data-string="dialogSkipButton"></button>
          <button id="workspace-modal-save"></button>
        </div>
      </div>
    </div>

    <div id="download-bar" hidden>
      <div id="download-container" role="list" class="has-thin-scrollbar"></div>
      <button id="download-close-button" class="i carbon:close"></button>
    </div>

    <div class="modal" id="manager-setup-dialog" hidden>
      <h3 class="modal-title" id="manager-setup-heading"></h3>
      <button
        id="manager-setup-close"
        class="modal-close-button i carbon:close"
      ></button>

      <div id="manager-setup-instructions-primary">
        <div
          class="light-fade"
          data-string="passwordManagerSetupStep1"
          data-allowHTML
        ></div>
        <div class="spacer"></div>
        <div
          class="light-fade"
          data-string="passwordManagerSetupStep2"
          data-allowHTML
        ></div>
      </div>

      <div id="manager-setup-instructions-secondary">
        <div
          class="light-fade"
          data-string="passwordManagerInstallerSetup"
          data-allowHTML
        ></div>
      </div>

      <div class="spacer"></div>

      <div
        id="manager-setup-drop-box"
        class="drag-and-drop-box"
        data-string="passwordManagerSetupDragBox"
      ></div>

      <div class="spacer"></div>
      <div class="spacer"></div>

      <div class="buttons">
        <input
          type="button"
          id="manager-setup-disable"
          data-value="disableAutofill"
        />
      </div>
    </div>

    <div id="password-capture-bar" hidden>
      <span id="password-capture-description"></span>
      <input id="password-capture-username" type="text" required />
      <span class="password-capture-section">
        <input id="password-capture-password" type="password" required />
        <button
          id="password-capture-reveal-password"
          class="i carbon:view"
        ></button>
      </span>
      <span class="password-capture-section">
        <button
          id="password-capture-save"
          data-string="passwordCaptureSave"
        ></button>
        <button
          id="password-capture-ignore"
          data-string="passwordCaptureDontSave"
        ></button>
      </span>
      <button
      id="password-capture-never-save"
      data-string="passwordCaptureNeverSave"
      ></button>
    </div>

    <div id="password-viewer" class="modal" hidden>
      <h2 class="modal-title" data-string="savedPasswordsHeading"></h2>
      <button class="modal-close-button i carbon:close"></button>
      <div
        id="password-viewer-empty"
        data-string="savedPasswordsEmpty"
        hidden
      ></div>
      <div id="password-viewer-list"></div>
      <div id="password-viewer-import-container">
        <button id="password-viewer-import"><span class="i carbon:document-import"></span><span data-string="importCredentials"></span></button>
        <button id="password-viewer-export"><span class="i carbon:export"></span><span data-string="exportCredentials"></span></button>
</div>
    </div>

    <!-- add scripts in Gruntfile.js -->

    <script src="dist/bundle.js"></script>
  </body>
</html>
