<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pro Settings</title>
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
    <link rel="stylesheet" href="proSettings.css" />
  </head>
  <body>
    <header class="pro-header">
      <h1 data-string="proSettingsTitle"></h1>
      <p class="pro-tagline" data-string="proSettingsTagline"></p>
    </header>

    <div class="pro-layout">
      <nav class="pro-tabs">
        <button class="pro-tab active" data-tab="provider"><i class="i carbon:api"></i><span data-string="proSettingsTabProvider"></span></button>
        <button class="pro-tab" data-tab="tools"><i class="i carbon:tools"></i><span data-string="proSettingsTabTools"></span></button>
        <button class="pro-tab" data-tab="profiles"><i class="i carbon:user-multiple"></i><span data-string="proSettingsTabProfiles"></span></button>
        <button class="pro-tab" data-tab="editor"><i class="i carbon:code"></i><span data-string="proSettingsTabEditor"></span></button>
        <button class="pro-tab" data-tab="terminal"><i class="i carbon:terminal"></i><span data-string="proSettingsTabTerminal"></span></button>
        <button class="pro-tab" data-tab="design"><i class="i carbon:paint-brush"></i><span data-string="proSettingsTabDesign"></span></button>
      </nav>

      <main class="pro-container">
        <!-- ===== provider tab ===== -->
        <section class="pro-panel active" id="panel-provider">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsProviderHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsProviderDescription"></p>
        </section>

        <div id="providers-list"></div>

        <div class="pro-actions-row">
          <button id="provider-add-open" class="pro-button">
            <i class="i carbon:add"></i>
            <span data-string="proSettingsAddProviderTitle"></span>
          </button>
        </div>

        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsCommitHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsCommitDescription"></p>
          <div class="pro-field-card">
            <div class="pro-field-row">
              <label class="pro-field-label" for="commit-model" data-string="proSettingsCommitModelLabel"></label>
              <select id="commit-model" class="pro-input pro-select"></select>
            </div>
          </div>
        </section>

        <footer class="pro-footer" data-string="proSettingsFooterNote"></footer>
      </section>

      <!-- ===== tools tab ===== -->
      <section class="pro-panel" id="panel-tools">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsToolsHeading"></span>
            <button id="tools-refresh" class="pro-icon-button" data-label="proSettingsToolsRefresh"><i class="i carbon:renew"></i></button>
          </div>
          <p class="pro-description" data-string="proSettingsToolsDescription"></p>
          <div class="pro-field-card" id="tools-builtin-list"></div>
        </section>

        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsMinToolsHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsMinToolsDescription"></p>
          <div class="pro-field-card" id="tools-custom-list"></div>
        </section>

        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsSkillsHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsSkillsDescription"></p>
          <div id="tools-skills-list"></div>
        </section>
      </section>

      <!-- ===== profiles tab ===== -->
      <section class="pro-panel" id="panel-profiles">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="profilesListHeading"></span>
          </div>
          <p class="pro-description" data-string="profilesSubheading"></p>
          <div id="profiles-notice" class="profiles-notice" hidden></div>
          <div id="profiles-list"></div>
          <div class="pro-actions-row">
            <button id="profiles-add-button" class="pro-button">
              <i class="i carbon:add"></i>
              <span data-string="taskProfileAdd"></span>
            </button>
          </div>
        </section>
      </section>

      <!-- ===== editor tab ===== -->
      <section class="pro-panel" id="panel-editor">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsEditorHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsPrefsNote"></p>
          <div class="pro-field-card">
            <div class="pro-field-row">
              <label class="pro-field-label" for="editor-font-size" data-string="proSettingsFontSizeLabel"></label>
              <input type="number" id="editor-font-size" class="pro-input pro-input-number" min="8" max="40" step="1" />
            </div>
            <div class="pro-field-row">
              <label class="pro-field-label" for="editor-tab-size" data-string="proSettingsTabSizeLabel"></label>
              <input type="number" id="editor-tab-size" class="pro-input pro-input-number" min="1" max="8" step="1" />
            </div>
            <div class="pro-field-row">
              <label class="pro-field-label" for="editor-word-wrap" data-string="proSettingsWordWrapLabel"></label>
              <input type="checkbox" id="editor-word-wrap" class="pro-switch" role="switch" />
            </div>
          </div>
        </section>
      </section>

      <!-- ===== terminal tab ===== -->
      <section class="pro-panel" id="panel-terminal">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsTerminalHeading"></span>
          </div>
          <p class="pro-description" data-string="proSettingsPrefsNote"></p>
          <div class="pro-field-card">
            <div class="pro-field-row">
              <label class="pro-field-label" for="terminal-font-size" data-string="proSettingsFontSizeLabel"></label>
              <input type="number" id="terminal-font-size" class="pro-input pro-input-number" min="8" max="40" step="1" />
            </div>
            <div class="pro-field-row">
              <label class="pro-field-label" for="terminal-shell" data-string="proSettingsShellLabel"></label>
              <input type="text" id="terminal-shell" class="pro-input" spellcheck="false" placeholder="/bin/bash" />
            </div>
          </div>
          <p class="pro-description" data-string="proSettingsShellHint"></p>
        </section>
      </section>

      <!-- ===== design tab ===== -->
      <section class="pro-panel" id="panel-design">
        <section class="pro-section">
          <div class="pro-section-header">
            <span class="pro-section-title" data-string="proSettingsDesignHeading"></span>
            <span class="pro-status-pill" id="figma-engine-pill">
              <span class="pro-status-dot"></span>
              <span id="figma-engine-status-text"></span>
            </span>
          </div>
          <p class="pro-description" data-string="proSettingsDesignDescription"></p>
          <div class="pro-kv" id="figma-engine-meta"></div>
          <div class="pro-actions-row">
            <button id="figma-power-button" class="pro-button">
              <span id="figma-power-button-label" data-string="designStartEngine"></span>
            </button>
            <button id="figma-window-button" class="pro-button" disabled>
              <span id="figma-window-button-label" data-string="designShowEngine"></span>
            </button>
          </div>
          <span id="figma-engine-error" class="pro-test-result fail" hidden></span>
        </section>
      </section>
      </main>
    </div>

    <div id="provider-add-overlay" class="pro-overlay" hidden>
      <div class="pro-dialog" role="dialog" aria-modal="true" aria-labelledby="provider-add-title">
        <h2 id="provider-add-title" data-string="proSettingsAddProviderTitle"></h2>
        <div class="pro-dialog-field">
          <label class="pro-field-label" for="provider-add-select" data-string="proSettingsProviderLabel"></label>
          <select id="provider-add-select" class="pro-input pro-select"></select>
          <a id="provider-add-link" class="pro-provider-link" target="_blank" rel="noopener"></a>
        </div>
        <div class="pro-dialog-field">
          <label class="pro-field-label" for="provider-add-key" data-string="proSettingsKeyHeading"></label>
          <input type="password" id="provider-add-key" class="pro-input" autocomplete="off" spellcheck="false" />
        </div>
        <p id="provider-add-error" class="pro-test-result fail" hidden></p>
        <div class="pro-actions-row pro-dialog-actions">
          <button id="provider-add-cancel" class="pro-button" data-string="profileClearCancel"></button>
          <button id="provider-add-confirm" class="pro-button pro-button-primary" data-string="proSettingsAddProvider"></button>
        </div>
      </div>
    </div>

    <div id="profile-add-overlay" class="pro-overlay" hidden>
      <div class="pro-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-add-title">
        <h2 id="profile-add-title" data-string="profileAddTitle"></h2>
        <div class="pro-dialog-field">
          <label class="pro-field-label" for="profile-add-input" data-string="taskProfileLabel"></label>
          <input type="text" id="profile-add-input" class="pro-input" autocomplete="off" spellcheck="false" />
        </div>
        <p id="profile-add-error" class="pro-test-result fail" hidden></p>
        <div class="pro-actions-row pro-dialog-actions">
          <button id="profile-add-cancel" class="pro-button" data-string="profileClearCancel"></button>
          <button id="profile-add-confirm" class="pro-button pro-button-primary" data-string="taskProfileAdd"></button>
        </div>
      </div>
    </div>

    <div id="tool-detail-overlay" class="pro-overlay" hidden>
      <div class="pro-dialog" role="dialog" aria-modal="true" aria-labelledby="tool-detail-title">
        <h2 id="tool-detail-title"></h2>
        <p id="tool-detail-subtitle" class="pro-tool-subtitle" hidden></p>
        <p id="tool-detail-description" class="pro-description"></p>
        <div id="tool-detail-meta" class="pro-kv" hidden></div>
        <div id="tool-detail-subtools-wrap" hidden>
          <div class="pro-skill-group-title pro-dialog-label" data-string="proSettingsSubTools"></div>
          <div id="tool-detail-subtools" class="pro-tool-subtools"></div>
        </div>
        <div class="pro-actions-row pro-dialog-actions">
          <button id="tool-detail-close" class="pro-button pro-button-primary" data-string="closeDialog"></button>
        </div>
      </div>
    </div>

    <div id="profile-clear-overlay" class="pro-overlay" hidden>
      <div class="pro-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-clear-title">
        <h2 id="profile-clear-title"></h2>
        <p class="pro-description" data-string="profileClearDataDescription"></p>
        <label class="pro-check-row">
          <input type="checkbox" id="profile-clear-site-data" class="pro-switch" role="switch" checked />
          <span data-string="profileClearSiteData"></span>
        </label>
        <label class="pro-check-row">
          <input type="checkbox" id="profile-clear-cache" class="pro-switch" role="switch" checked />
          <span data-string="profileClearCache"></span>
        </label>
        <p id="profile-clear-usage" class="pro-description"></p>
        <div class="pro-actions-row pro-dialog-actions">
          <button id="profile-clear-cancel" class="pro-button" data-string="profileClearCancel"></button>
          <button id="profile-clear-confirm" class="pro-button pro-button-danger" data-string="profileClearConfirm"></button>
        </div>
      </div>
    </div>

    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../js/util/theme.js"></script>
    <script src="../../dist/localization.build.js"></script>
    <script src="proSettings.js"></script>
  </body>
</html>
